; Unit tests for components/oclean - run from the tests/ directory:
;   pio test -e native
;
; Tests are pure C++ (no esphome dependencies) and run on the host, not the ESP32.
; The pure functions in oclean_protocol.cpp are pulled in directly.

[platformio]
test_dir = .

[env:native]
platform = native
test_framework = unity
test_filter = test_*
build_flags =
    -std=gnu++20
    -Wall
    -Wextra
    ; No -Werror: a compiler bump on the CI runner would turn CI red without a
    ; code change. The strict -Werror pass in CI covers that.
    -I ../components/oclean
