name: tests
on:
  push:
    branches: [main]
    paths: ["components/oclean/**", "custom_components/**", "dist/**", "hacs.json", "tests/**", ".github/**", ".devcontainer/requirements.txt", "example.yaml", ".intellisense.yaml", "pyproject.toml", ".pre-commit-config.yaml", ".clang-format", ".clang-tidy"]
  pull_request:
    paths: ["components/oclean/**", "custom_components/**", "dist/**", "hacs.json", "tests/**", ".github/**", ".devcontainer/requirements.txt", "example.yaml", ".intellisense.yaml", "pyproject.toml", ".pre-commit-config.yaml", ".clang-format", ".clang-tidy"]
  # The release workflow runs these gates instead of keeping its own copy, which
  # is how the two lists drifted apart before.
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
env:
  ESPHOME_VERSION: "2026.8.1"
  ESPHOME_FLOOR: "2026.1.0"
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  lint:
    name: ruff + pre-commit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Cache pre-commit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: ${{ runner.os }}-pre-commit-
      - name: Install pre-commit
        run: |
          set -euo pipefail
          pin="$(grep -E '^pre-commit==' .devcontainer/requirements.txt)"
          pip install "${pin}"
      - name: Run pre-commit (ruff lint + format + hygiene)
        run: pre-commit run --all-files --show-diff-on-failure
      - name: Check coverage card parses
        run: node --check dist/oclean-coverage-card.js
  unit-tests:
    name: protocol unit tests (native)
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Cache PlatformIO
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('tests/platformio.ini') }}
          restore-keys: ${{ runner.os }}-pio-
      - name: Install PlatformIO
        run: |
          set -euo pipefail
          pin="$(grep -E '^platformio==' .devcontainer/requirements.txt)"
          pip install "${pin}"
      - name: Run protocol unit tests
        run: |
          set -euo pipefail
          pio test -d tests -e native < /dev/null
          echo "--- re-run built binary as source of truth ---"
          tests/.pio/build/native/program
      - name: Compile the esphome-free layers under strict warnings
        run: |
          set -euo pipefail
          strict=(-std=gnu++20 -fsyntax-only -Werror -Wall -Wextra -Wconversion
                  -Wsign-conversion -Wshadow -Wold-style-cast -I components/oclean)
          g++ "${strict[@]}" components/oclean/oclean_protocol.cpp
          g++ "${strict[@]}" components/oclean/oclean_profile.cpp
  clang-tidy:
    name: clang-tidy (esp32 compile database)
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Cache PlatformIO and the ESP-IDF toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.platformio
            ~/.cache/esphome
          key: ${{ runner.os }}-idf-${{ env.ESPHOME_VERSION }}-riscv-tidy
          restore-keys: |
            ${{ runner.os }}-idf-${{ env.ESPHOME_VERSION }}-riscv
            ${{ runner.os }}-idf-${{ env.ESPHOME_VERSION }}-
      - name: Install ESPHome and clang-tidy
        run: |
          set -euo pipefail
          pin="$(grep -E '^clang-tidy==' .devcontainer/requirements.txt)"
          pip install "esphome==${ESPHOME_VERSION}" "${pin}"
      - name: Run clang-tidy
        run: CI_CONFIG=.github/ci-build.yaml bash tests/run_clang_tidy.sh

  esphome-build:
    name: esphome compile (${{ matrix.arch }})
    needs: unit-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: xtensa
            boards: esp32dev esp32-s3-devkitc-1
          - arch: riscv
            boards: esp32-c3-devkitm-1 esp32-c6-devkitc-1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Cache PlatformIO and the ESP-IDF toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.platformio
            ~/.cache/esphome
          key: ${{ runner.os }}-idf-${{ env.ESPHOME_VERSION }}-${{ matrix.arch }}
          restore-keys: ${{ runner.os }}-idf-${{ env.ESPHOME_VERSION }}-
      - name: Install ESPHome
        run: pip install "esphome==${ESPHOME_VERSION}"
      - name: Run codegen unit tests
        run: python -m unittest discover -s tests/python -v
      - name: Compile every board, failing on any warning from the component
        run: |
          set -euo pipefail
          for board in ${{ matrix.boards }}; do
            bash tests/check_esp32_warnings.sh .github/ci-build.yaml "$board"
          done
      # api: without homeassistant_services is the default shape of a user
      # config, and the session-event call is compiled out there. Build it so a
      # wrong guard around that call fails CI instead of the user's first build.
      # Both variants below transform ci-build.yaml, and a transform that matches
      # nothing would compile the unmodified config and pass without testing
      # anything. Each asserts its own effect before compiling.
      - name: Compile without homeassistant_services
        if: matrix.arch == 'xtensa'
        run: |
          set -euo pipefail
          python - <<'PY'
          src = open(".github/ci-build.yaml").read()
          out = src.replace("name: ci-build", "name: ci-build-noha")
          before = out
          out = "\n".join(
              line for line in out.split("\n")
              if line.strip() != "homeassistant_services: true"
          )
          assert out != before, "homeassistant_services line not found: the api: block moved or was reindented"
          assert "homeassistant_services" not in out, "homeassistant_services still present after the strip"
          assert "\napi:" in out, "api: block disappeared, the transform cut too much"
          open(".github/ci-build-noha.yaml", "w").write(out)
          PY
          esphome compile .github/ci-build-noha.yaml
      # A read-only node: no switch/number/select/button block, so those
      # platforms are absent from the build. Keeps the per-platform guards
      # honest, since main.cpp includes every component header regardless.
      - name: Compile without the control platforms
        if: matrix.arch == 'xtensa'
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          CONTROL = ("switch", "number", "select", "button")
          src = open(".github/ci-build.yaml").read().replace("name: ci-build", "name: ci-build-readonly")
          out, skip = [], False
          for line in src.split("\n"):
              if re.match(r"^(%s):\s*$" % "|".join(CONTROL), line):
                  skip = True
                  continue
              # A top-level key or a column-zero comment ends the dropped block.
              # Treating a comment as part of it swallows the rest of the file.
              if skip and line and not line[0].isspace():
                  skip = False
              if not skip:
                  out.append(line)
          text = "\n".join(out)
          for key in CONTROL:
              assert not re.search(r"^%s:" % key, text, re.M), f"{key}: block survived the strip"
          for key in ("sensor", "binary_sensor", "text_sensor", "oclean", "esp32"):
              assert re.search(r"^%s:" % key, text, re.M), f"{key}: was cut, the transform ate too much"
          open(".github/ci-build-readonly.yaml", "w").write(text)
          PY
          esphome compile .github/ci-build-readonly.yaml
  config-floor:
    name: config check and build at the ESPHome floor
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      # Pin to the declared floor so min_version is actually exercised, and
      # validate the published example (which the compile job never touches).
      - name: Cache PlatformIO and the ESP-IDF toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.platformio
            ~/.cache/esphome
          key: ${{ runner.os }}-idf-${{ env.ESPHOME_FLOOR }}-xtensa
          restore-keys: ${{ runner.os }}-idf-${{ env.ESPHOME_FLOOR }}-
      - name: Install ESPHome (component floor)
        run: pip install "esphome==${ESPHOME_FLOOR}"
      - name: Provide dummy secrets for the example
        run: |
          cat > secrets.yaml <<'EOF'
          wifi_ssid: ci
          wifi_password: ci-password-123
          api_encryption_key: cJlpAFA6N5wBzUgFSpMSo8QVMXZzKXwUBG6oHtGOb6Q=
          ota_password: ci-ota-password
          brush_mac: AA:BB:CC:DD:EE:FF
          EOF
      - name: Validate example and CI configs
        run: |
          set -euo pipefail
          esphome config example.yaml
          esphome config .github/ci-build.yaml
          esphome config .intellisense.yaml
      # min_version claims the C++ builds here too, which config alone never
      # checks: an API added after the floor would only fail on a user's machine.
      - name: Compile at the floor
        run: |
          set -euo pipefail
          esphome compile .github/ci-build.yaml
