name: release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # Every gate lives in tests.yml; running it here rather than repeating its
  # steps is what keeps a release from shipping something the PR gates reject.
  gates:
    name: test gates
    uses: ./.github/workflows/test.yml
  publish:
    name: publish release
    needs: gates
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # persist-credentials: false keeps the write-scoped token out of .git. gh
      # below authenticates via the GH_TOKEN env instead.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes
