# CI-only configuration that compiles the full component (all platforms and
# every entity) so a build-breaking change in any source file fails CI. Not
# meant for flashing. Uses a dummy BLE MAC; no device is contacted at compile.
esphome:
  name: ci-build
  # Matches the component floor (select current_option API, 2026.1.0).
  min_version: 2026.1.0
  devices:
    - id: dev_second
      name: "CI second brush"

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

# The component uses api (session-history event) and time (clock); both need a
# network, so a dummy wifi is here purely to satisfy compile validation. Nothing
# connects at build time. This compiles the real with-api, with-time code path.
wifi:
  ssid: "esphome-ci"
  password: "esphome-ci-password"

api:
  # fire_homeassistant_event() (session-history events) needs this flag.
  homeassistant_services: true

time:
  - platform: sntp
    id: ci_time

external_components:
  - source:
      type: local
      path: ../components
    components: [oclean]

esp32_ble_tracker:

ble_client:
  - id: ble_test
    mac_address: AA:BB:CC:DD:EE:FF
  - id: ble_second
    mac_address: AA:BB:CC:DD:EE:00

oclean:
  - id: hub_test
    ble_client_id: ble_test
    time_id: ci_time
    # Exercise the charging-aware adaptive-poll codegen.
    update_interval: 3600s
    charging_interval: 600s
    # Compile the dev-gated branches too.
    expose_dev_sensors: true
    # Cover the remaining hub options.
    tzindex: 16
    hold_connection_while_docked: true
    auto_sync_time: true
    # Compile the per-session automation hook.
    on_session:
      - logger.log:
          format: "session dur=%us valid=%us score=%u"
          args:
            ["(unsigned) x.duration_s", "(unsigned) x.valid_duration_s", "(unsigned) x.score"]
  # Second hub: compiles the explicit name_prefix, and makes hub_test derive one.
  - id: hub_second
    ble_client_id: ble_second
    name_prefix: "Second"

# Every entity platform auto-creates its full entity set, so a bare platform
# block compiles every entity codegen path (dev-gated rows included via
# expose_dev_sensors above).
sensor:
  - platform: oclean
    oclean_id: hub_test

binary_sensor:
  - platform: oclean
    oclean_id: hub_test

text_sensor:
  - platform: oclean
    oclean_id: hub_test

switch:
  - platform: oclean
    oclean_id: hub_test
  # Switch and button are enough for hub_second; no need to double every entity.
  - platform: oclean
    oclean_id: hub_second
    device_id: dev_second

number:
  - platform: oclean
    oclean_id: hub_test

select:
  - platform: oclean
    oclean_id: hub_test
    # Exercise the named custom-mode codegen.
    brush_scheme:
      custom_modes:
        - name: CI custom mode
          program:
            - gear: 8
              duration: 30
            - gear: 8
              duration: 30
            - gear: 8
              duration: 30
            - gear: 8
              duration: 30

button:
  - platform: oclean
    oclean_id: hub_test
  - platform: oclean
    oclean_id: hub_second
    device_id: dev_second
