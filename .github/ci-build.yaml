# CI-only configuration that compiles the full component (all platforms and
# every entity) so a build-breaking change in any source file fails CI. Not
# meant for flashing. Uses a dummy BLE MAC; no device is contacted at compile.
substitutions:
  board: esp32dev

esphome:
  name: ci-build
  # Matches the component floor (cv.sensitive, 2026.6.0).
  min_version: 2026.6.0
  devices:
    - id: dev_second
      name: "CI second brush"

esp32:
  board: ${board}
  framework:
    type: esp-idf

logger:
  # the GATT map dump compiles only at VERBOSE
  level: VERBOSE

# The component uses api (session-history event) and time (clock); both need a
# network, so a dummy wifi is here purely to satisfy compile validation. Nothing
# connects at build time. This compiles the real with-api, with-time code path.
wifi:
  ssid: "esphome-ci"
  password: "esphome-ci-password"

# The in-node session receiver (cloud_receiver below) reuses this shared web
# server, so it compiles the web_server_base handler path.
web_server:
  port: 80

api:
  # fire_homeassistant_event() (session-history events) needs this flag.
  homeassistant_services: true

time:
  - platform: sntp
    id: ci_time

external_components:
  - source:
      type: local
      path: ../components
    components: [oclean]

esp32_ble_tracker:

ble_client:
  - id: ble_test
    mac_address: AA:BB:CC:DD:EE:FF
  - id: ble_second
    mac_address: AA:BB:CC:DD:EE:00

oclean:
  - id: hub_test
    ble_client_id: ble_test
    time_id: ci_time
    # Exercise the charging-aware adaptive-poll codegen.
    update_interval: 3600s
    charging_interval: 600s
    # Cover the remaining hub options.
    tzindex: 16
    hold_connection_while_docked: true
    auto_sync_time: true
    # Compile the per-session automation hook.
    on_session:
      - logger.log:
          format: "session dur=%us valid=%us score=%u"
          args:
            ["(unsigned) x.duration_s", "(unsigned) x.valid_duration_s", "(unsigned) x.score"]
  # hub_test stays without a prefix so the multi-hub warning runs too.
  # hub_second is the other model, so both entity sets compile.
  - id: hub_second
    ble_client_id: ble_second
    model: x_ultra_20
    name_prefix: "Second"
    # Compiles the BluFi provisioning path (USE_OCLEAN_BLUFI); the SSID falls
    # back to the wifi: block above since no wifi_ssid is set here.
    wifi_provisioning: true
    # Compiles the in-node session receiver (USE_OCLEAN_CLOUD_RECEIVER) on the
    # web_server above.
    cloud_receiver: true
    # Compiles the weather answer (USE_OCLEAN_WEATHER): entity subscription and
    # the forecast action with its response.
    weather: weather.forecast_home
    time_id: ci_time
    # Compiles the birthday greeting the hub keeps on the brush.
    birthday: "02-29"
    gender: female
    age: 9

# Every entity platform auto-creates its full entity set, so a bare platform
# block compiles every entity codegen path.
sensor:
  - platform: oclean
    oclean_id: hub_test
  - platform: oclean
    oclean_id: hub_second
    device_id: dev_second

binary_sensor:
  - platform: oclean
    oclean_id: hub_test
  - platform: oclean
    oclean_id: hub_second
    device_id: dev_second

text_sensor:
  - platform: oclean
    oclean_id: hub_test
  - platform: oclean
    oclean_id: hub_second
    device_id: dev_second

switch:
  - platform: oclean
    oclean_id: hub_test
  - platform: oclean
    oclean_id: hub_second
    device_id: dev_second

number:
  - platform: oclean
    oclean_id: hub_test
  - platform: oclean
    oclean_id: hub_second
    device_id: dev_second

select:
  - platform: oclean
    oclean_id: hub_test
    # Exercise the named custom-mode codegen.
    brush_scheme:
      custom_modes:
        - name: CI custom mode
          program:
            - gear: 8
              duration: 30
            - gear: 8
              duration: 30
            - gear: 8
              duration: 30
            - gear: 8
              duration: 30
  - platform: oclean
    oclean_id: hub_second
    device_id: dev_second
    # The X Ultra 20 options: its fixed modes plus a gear past the X Pro Elite's.
    brush_scheme:
      custom_modes:
        - name: CI high gear
          program:
            - gear: 54
              duration: 30

button:
  - platform: oclean
    oclean_id: hub_test
  - platform: oclean
    oclean_id: hub_second
    device_id: dev_second
